<style>
  html, body, #root {
    background: #020617 !important;
    animation: none !important;
    transition: none !important;
  }
  *, *::before, *::after {
    animation: none !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition: none !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .animate-bounce,
  .animate-pulse,
  .animate-fade-in,
  [class*="animate-"],
  [class*="pulse"],
  [class*="bounce"],
  [class*="fade"] {
    animation: none !important;
  }
  body {
    overflow-x: hidden;
    margin: 0;
    opacity: 1 !important;
    filter: none !important;
  }
  @media print {
    @page { size: A4; margin: 14mm; }
    html, body { background: #ffffff !important; color: #111827 !important; }
    body { font-family: Georgia, "Times New Roman", serif !important; }
    .no-print, button, input[type="file"] { display: none !important; }
    header { position: static !important; background: #ffffff !important; border-color: #d1d5db !important; color: #111827 !important; }
    main { max-width: none !important; padding: 18px 0 !important; color: #111827 !important; }
    footer { color: #6b7280 !important; border-color: #d1d5db !important; }
    [class*="bg-[#020617]"], [class*="bg-white/[0.05]"], [class*="bg-black/"] { background: #ffffff !important; }
    [class*="text-white"] { color: #111827 !important; }
    [class*="border-white"] { border-color: #d1d5db !important; }
    [class*="shadow-"] { box-shadow: none !important; }
    [class*="backdrop-blur"] { backdrop-filter: none !important; }
  }
  .gallery-image-missing {
    background: linear-gradient(135deg, #102542, #0b1a32 55%, #173a52);
    position: relative;
  }
  .gallery-image-missing::after {
    content: "J5 INTERNATIONAL CHURCH";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.55);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .2em;
  }
  @keyframes archbishopWelcome {
    0% { opacity: 0; transform: translateY(18px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes archbishopBalloon {
    0% { transform: translateY(90px) rotate(-8deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(12deg); opacity: 0; }
  }
  .archbishop-welcome {
    animation: archbishopWelcome 0.65s ease-out both !important;
  }
  .archbishop-balloon {
    animation: archbishopBalloon 5s ease-in-out both !important;
  }
</style>

  var now = new Date();
  return now.toISOString().slice(11, 19);

function getStored(key, defaultVal) {
  try {
    var stored = localStorage.getItem(key);
    return stored ? JSON.parse(stored) : defaultVal;
  } catch (e) {
    return defaultVal;
  }
}

function saveStored(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));

}
